[project]
name = "as-all"
version = "0.4.0"
description = "Portable Gemini and Qwen AgentDojo defense and Witness-form evaluation"
requires-python = ">=3.12,<3.13"
dependencies = [
  "agentdojo", "semantic-action-frame-guard", "openai==1.76.2",
  "pydantic[email]==2.11.4", "httpx==0.28.1", "google-genai==1.15.0",
  "networkx==3.6.1", "langchain==0.3.24", "anthropic==0.50.0", "cohere==5.15.0",
  "transformers==5.12.1", "torch==2.5.1", "sentencepiece==0.2.0",
  "pytest==8.3.5", "ruff==0.11.13"
]

[tool.uv.sources]
agentdojo = { path = "vendor/agentdojo", editable = true }
semantic-action-frame-guard = { path = "vendor/core", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/as_all"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
extend-exclude = ["vendor", "reference"]
